name: Kande Web JP Prod Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Files to Prod Directory
        run: |
          sudo mkdir -p /opt/amuryx/kande-web-jp-prod
          sudo rsync -a --delete --exclude='.git' ./ /opt/amuryx/kande-web-jp-prod/
          sudo chown -R $USER:$USER /opt/amuryx/kande-web-jp-prod

      - name: Build Images
        run: |
          cd /opt/amuryx/kande-web-jp-prod
          docker compose -f docker-compose.prod.yml build

      - name: Zero-Downtime Restart
        run: |
          cd /opt/amuryx/kande-web-jp-prod
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Post-Deploy Cleanup
        run: |
          docker image prune -f

      - name: Status Check
        run: |
          docker ps --filter "name=amuryx_kande_web_jp_prod" --format "table {{.Names}}\t{{.Status}}"
          docker ps --format '{{.Names}}' | grep -q "^amuryx_kande_web_jp_prod$" \
            || { echo "Missing container: amuryx_kande_web_jp_prod"; exit 1; }
